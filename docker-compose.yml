services:
  tailnet-proxy:
    image: tailscale/tailscale:latest
    hostname: tailnet-proxy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=true
      - TS_USERSPACE=false
      - TS_TAILSCALED_EXTRA_ARGS=--tun=tailscale0
      - TS_SOCKS5_SERVER=:1055
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=:1056
      - TS_EXTRA_ARGS=--login-server=https://${HEADSCALE_DOMAIN} --accept-routes
    volumes:
      - ts_state:/var/lib/tailscale

    ports:
      - "127.0.0.1:1055:1055"   # SOCKS5
      - "127.0.0.1:1056:1056"   # HTTP proxy (CONNECT)
    restart: unless-stopped

volumes:
  ts_state:
